name: Fundnote Daily Tweet

on:
  schedule:
    # 日本時間（平日）17:45, 17:50, 17:55
    - cron: '45,50,55 8 * * 1-5'
    # 日本時間（平日）18:00〜18:55（5分おき）
    - cron: '*/5 9 * * 1-5'
    # 日本時間（平日）19:00〜19:30（5分おき）
    - cron: '0,5,10,15,20,25,30 10 * * 1-5'
  workflow_dispatch: # 手動で即座にテスト実行するボタン

jobs:
  tweet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: pip install requests beautifulsoup4 tweepy

      - name: スクリプトの実行（更新があればツイート）
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python main.py

      - name: 投稿済み日付の自動保存
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add last_date.txt || true
          git commit -m "Update last_date.txt [skip ci]" || true
          git push || true
